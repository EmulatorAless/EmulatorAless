<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Alex — EmulatorAless</title>
  <desc id="desc">Profile banner for Alex</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c242e"/>
      <stop offset="55%" stop-color="#243040"/>
      <stop offset="100%" stop-color="#1a3a3a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5ec8b8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ec8b8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5ec8b8" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font-family: Georgia, "Times New Roman", serif; font-size: 64px; font-weight: 700; fill: #f4f7f8; letter-spacing: -1px; }
      .role { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 20px; fill: #9eb0b8; letter-spacing: 3px; }
      .tag { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #5ec8b8; }
    </style>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="120" fill="#5ec8b8" opacity="0.06"/>
  <circle cx="160" cy="300" r="90" fill="#5ec8b8" opacity="0.05"/>
  <rect x="80" y="78" width="4" height="184" fill="#5ec8b8"/>
  <text class="name" x="110" y="150">Alex</text>
  <text class="role" x="110" y="198">FULL STACK · MOBILE · WEB</text>
  <rect x="110" y="228" width="320" height="1.5" fill="url(#line)"/>
  <text class="tag" x="110" y="268">Building clean digital experiences</text>
  <text class="tag" x="110" y="292" opacity="0.75">Creando experiencias digitales claras</text>
</svg>
